<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Fireplace & Hearth account to manage services and track your projects.">
    <title>Sign Up — Fireplace & Hearth</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="components.js" defer></script>
</head>
<body class="auth-page">
    <div class="auth-card">
        <!-- Top-right toggles -->
        <div class="auth-toggles">
            <button onclick="toggleDir(event)" class="nav-icon-btn" title="Toggle Direction">
                <span class="dir-label" style="font-size:0.65rem;font-weight:700;">LTR</span>
            </button>
            <button onclick="toggleTheme(event)" class="nav-icon-btn" title="Toggle Theme">
                <span class="theme-icon-wrap"></span>
            </button>
        </div>

        <!-- Logo -->
        <a href="index.html" class="auth-logo">
            <div class="nav-logo-icon" style="color:var(--clr-text);">
                <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="65" width="70" height="15" rx="3" fill="currentColor" opacity="0.3"/>
                    <rect x="20" y="45" width="60" height="22" rx="4" fill="currentColor" opacity="0.2"/>
                    <path d="M50 20C46 30 35 40 35 55a15 15 0 0030 0c0-15-11-25-15-35z" fill="var(--clr-primary)" opacity="0.9"/>
                    <path d="M50 32c-2.5 6-8 12-8 20a8 8 0 0016 0c0-8-5.5-14-8-20z" fill="#E8A620" opacity="0.85"/>
                    <path d="M50 42c-1.5 3.5-4.5 7-4.5 11a4.5 4.5 0 009 0c0-4-3-7.5-4.5-11z" fill="#F5D76B"/>
                </svg>
            </div>
            <div class="nav-logo-text">
                <span class="brand-top">FIREPLACE</span>
                <span class="brand-bottom">& Hearth</span>
            </div>
        </a>

        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join us to manage services and track your projects</p>

        <form class="auth-form" onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='login.html';">
            <div class="form-group">
                <label class="form-label" for="signup-first">First Name</label>
                <input type="text" id="signup-first" class="form-input" placeholder="John" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-last">Last Name</label>
                <input type="text" id="signup-last" class="form-input" placeholder="Smith" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-email">Email Address</label>
                <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-phone">Phone Number</label>
                <input type="tel" id="signup-phone" class="form-input" placeholder="(503) 555-0100">
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-password">Password</label>
                <div class="pw-field">
                    <input type="password" id="signup-password" class="form-input" placeholder="Create a password" required>
                    <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('signup-password', this)">
                        <span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-confirm">Confirm Password</label>
                <div class="pw-field">
                    <input type="password" id="signup-confirm" class="form-input" placeholder="Confirm your password" required>
                    <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('signup-confirm', this)">
                        <span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                    </button>
                </div>
            </div>

            <div style="margin-bottom:var(--space-lg);">
                <label class="auth-remember">
                    <input type="checkbox" required> I agree to the <a href="coming-soon.html" style="color:var(--clr-primary);font-weight:600;">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Create Account</button>

            <div class="auth-divider">
                <span>or sign up with</span>
            </div>

            <div class="social-login-btns">
                <button type="button" class="social-login-btn" onclick="alert('Google sign up coming soon!')">
                    <i class="fa-brands fa-google" style="font-size:18px;"></i> Google
                </button>
                <button type="button" class="social-login-btn" onclick="alert('Apple sign up coming soon!')">
                    <i class="fa-brands fa-apple" style="font-size:19px;"></i> Apple
                </button>
            </div>

            <p class="auth-footer-text">Already have an account? <a href="login.html">Sign In</a></p>
        </form>
    </div>

    <script>document.addEventListener('DOMContentLoaded', initAuthPage);</script>
</body>
</html>
