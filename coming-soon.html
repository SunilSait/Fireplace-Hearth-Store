<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something exciting is coming soon from Fireplace & Hearth. Stay tuned!">
    <title>Coming Soon — Fireplace & Hearth</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="components.js" defer></script>
</head>
<body class="auth-page">
    <!-- Top-right toggles -->
    <div class="error-toggles">
        <button onclick="toggleDir(event)" class="nav-icon-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.65rem;font-weight:700;">LTR</span>
        </button>
        <button onclick="toggleTheme(event)" class="nav-icon-btn" title="Toggle Theme">
            <span class="theme-icon-wrap"></span>
        </button>
    </div>

    <div class="coming-soon-page">
        <div class="coming-soon-card">
            <!-- Logo -->
            <a href="index.html" class="auth-logo" style="margin-bottom:var(--space-2xl);">
                <div class="nav-logo-icon" style="color:var(--clr-text);">
                    <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="15" y="65" width="70" height="15" rx="3" fill="currentColor" opacity="0.3"/>
                        <rect x="20" y="45" width="60" height="22" rx="4" fill="currentColor" opacity="0.2"/>
                        <path d="M50 20C46 30 35 40 35 55a15 15 0 0030 0c0-15-11-25-15-35z" fill="var(--clr-primary)" opacity="0.9"/>
                        <path d="M50 32c-2.5 6-8 12-8 20a8 8 0 0016 0c0-8-5.5-14-8-20z" fill="#E8A620" opacity="0.85"/>
                        <path d="M50 42c-1.5 3.5-4.5 7-4.5 11a4.5 4.5 0 009 0c0-4-3-7.5-4.5-11z" fill="#F5D76B"/>
                    </svg>
                </div>
                <div class="nav-logo-text">
                    <span class="brand-top">FIREPLACE</span>
                    <span class="brand-bottom">& Hearth</span>
                </div>
            </a>

            <div class="coming-soon-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
            </div>

            <h1>Something Warm Is Coming</h1>
            <p>We're working on something exciting! This page is currently under construction. Stay tuned for updates.</p>

            <!-- Countdown -->
            <div class="countdown-grid" id="countdown">
                <div class="countdown-item">
                    <div class="countdown-num" id="cd-days">42</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-num" id="cd-hours">08</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-num" id="cd-minutes">24</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-num" id="cd-seconds">36</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>

            <!-- Notify -->
            <form class="coming-soon-form" onsubmit="event.preventDefault(); alert('Thank you! We will notify you when this page goes live.'); this.reset();">
                <input type="email" class="form-input" placeholder="Enter your email" required>
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>

            <a href="index.html" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuthPage();

            // Countdown timer
            const launchDate = new Date();
            launchDate.setDate(launchDate.getDate() + 42);

            function updateCountdown() {
                const now = new Date();
                const diff = launchDate - now;
                if (diff <= 0) return;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
                document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
