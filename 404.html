<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found. The page you're looking for doesn't exist or has been moved from Fireplace & Hearth.">
    <title>404 — Page Not Found | Fireplace & Hearth</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="Fireplace & Hearth Home" style="text-decoration:none;">
        <div class="nav-logo-icon" style="color:var(--clr-text);">
            <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="15" y="65" width="70" height="15" rx="3" fill="currentColor" opacity="0.3"/>
                <rect x="20" y="45" width="60" height="22" rx="4" fill="currentColor" opacity="0.2"/>
                <path d="M50 20C46 30 35 40 35 55a15 15 0 0030 0c0-15-11-25-15-35z" fill="var(--clr-primary)" opacity="0.9"/>
                <path d="M50 32c-2.5 6-8 12-8 20a8 8 0 0016 0c0-8-5.5-14-8-20z" fill="#E8A620" opacity="0.85"/>
                <path d="M50 42c-1.5 3.5-4.5 7-4.5 11a4.5 4.5 0 009 0c0-4-3-7.5-4.5-11z" fill="#F5D76B"/>
            </svg>
        </div>
        <div class="nav-logo-text">
            <span class="brand-top">FIREPLACE</span>
            <span class="brand-bottom">& Hearth</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir(event)" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme(event)" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <!-- Error Illustration with rotating warm flame -->
        <div class="error-illustration">
            <svg class="flame-spin" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="70" cy="70" r="60" stroke="var(--clr-primary)" stroke-width="2" stroke-dasharray="8 6" opacity="0.3"/>
                <path d="M70 25C63 42 45 58 45 82a25 25 0 0050 0c0-24-18-40-25-57z" fill="var(--clr-primary)" opacity="0.4"/>
                <path d="M70 45c-4 11-14 21-14 35a14 14 0 0028 0c0-14-10-24-14-35z" fill="#E8A620" opacity="0.6"/>
            </svg>
            <div class="error-code">404</div>
        </div>

        <div class="error-subtitle">The Fire Went Out Here</div>
        <p class="error-desc">
            The page you're looking for doesn't exist, has been moved, or has burned out. Let us rekindle your journey and guide you back to warmth.
        </p>

        <!-- Action Buttons -->
        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn btn-primary btn-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Back to Home
            </a>
            <a href="contact.html" class="btn btn-secondary btn-lg">Contact Support</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();
    });
</script>
</body>
</html>
